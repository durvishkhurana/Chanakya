<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Chanakya architecture</title>
  <desc id="d">Missions enter through three doors, are queued and recorded in a ledger, and become calls. In a call the brain tracks the merchant's worries, plans the next move and words it. Every write goes through a safety gate to labelled mock business systems, a verifier confirms the outcome, and people take over through hand-off cards. Dashboards read the ledger's event stream.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b66"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#9fb3ad;stroke-width:1.4}
      .brain{fill:#eef7f3;stroke:#3f8f74;stroke-width:1.6}
      .safe{fill:#fff6e8;stroke:#c98a2b;stroke-width:1.6}
      .mock{fill:#f4f4f6;stroke:#8a8a99;stroke-width:1.4;stroke-dasharray:5 4}
      .h{font-size:15px;font-weight:600;fill:#1d2b27}
      .s{font-size:12px;fill:#4a5a55}
      .k{font-size:11px;fill:#6b7a75;letter-spacing:.06em}
      .l{stroke:#5b6b66;stroke-width:1.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1000" height="600" fill="#fbfcfb"/>

  <text x="24" y="34" class="k">THREE DOORS</text>
  <rect class="box" x="24" y="48" width="180" height="54" rx="8"/><text x="38" y="71" class="h">Merchant asks</text><text x="38" y="90" class="s">callback, product page</text>
  <rect class="box" x="24" y="114" width="180" height="54" rx="8"/><text x="38" y="137" class="h">Data says so</text><text x="38" y="156" class="s">card attempts, unused device</text>
  <rect class="box" x="24" y="180" width="180" height="54" rx="8"/><text x="38" y="203" class="h">Colleague hands over</text><text x="38" y="222" class="s">field note, dropped call</text>

  <rect class="box" x="248" y="96" width="190" height="90" rx="8"/><text x="262" y="122" class="h">Mission intake + queue</text><text x="262" y="142" class="s">mission card, starting worries,</text><text x="262" y="158" class="s">priority, calling hours</text>
  <path class="l" d="M204 75 C226 75 226 130 246 130"/><path class="l" d="M204 141 L246 141"/><path class="l" d="M204 207 C226 207 226 152 246 152"/>

  <rect class="box" x="248" y="236" width="190" height="78" rx="8"/><text x="262" y="262" class="h">Mission ledger</text><text x="262" y="282" class="s">every step is an event;</text><text x="262" y="298" class="s">state machine, replayable</text>
  <path class="l" d="M343 186 L343 234"/>

  <text x="486" y="34" class="k">THE CALL</text>
  <rect class="box" x="486" y="48" width="230" height="64" rx="8"/><text x="500" y="72" class="h">Voice</text><text x="500" y="92" class="s">browser or phone, Sarvam speech</text>
  <rect class="brain" x="486" y="132" width="230" height="182" rx="10"/>
  <text x="500" y="156" class="h">Chanakya brain</text>
  <text x="500" y="182" class="s">1. Belief tracker: which worry is real</text>
  <text x="500" y="204" class="s">2. Look-ahead planner (NRPA) against</text>
  <text x="514" y="220" class="s">simulated merchants</text>
  <text x="500" y="242" class="s">3. Realizer: words it from sourced</text>
  <text x="514" y="258" class="s">product facts, safety fallbacks</text>
  <text x="500" y="284" class="s">Coach mode runs the same brain</text>
  <text x="500" y="300" class="s">silently on a human's call</text>
  <path class="l" d="M601 112 L601 130"/><path class="l" d="M440 156 C462 156 462 120 484 92"/>
  <path class="l" d="M484 260 L440 270"/>

  <text x="760" y="34" class="k">GETTING IT DONE</text>
  <rect class="safe" x="760" y="48" width="216" height="92" rx="10"/><text x="774" y="72" class="h">Safety gate</text><text x="774" y="92" class="s">AI disclosed, explicit consent,</text><text x="774" y="108" class="s">calling hours, do-not-call,</text><text x="774" y="124" class="s">no sensitive data, audit trail</text>
  <rect class="mock" x="760" y="160" width="216" height="72" rx="8"/><text x="774" y="184" class="h">Mock business systems</text><text x="774" y="204" class="s">onboarding link, field visit,</text><text x="774" y="220" class="s">WhatsApp summary (labelled mocks)</text>
  <rect class="box" x="760" y="252" width="216" height="62" rx="8"/><text x="774" y="276" class="h">Verifier</text><text x="774" y="296" class="s">DONE only when a system confirms</text>
  <path class="l" d="M718 190 C740 190 740 94 758 94"/><path class="l" d="M868 140 L868 158"/><path class="l" d="M868 232 L868 250"/>
  <path class="l" d="M760 300 C600 360 470 330 440 300"/>

  <rect class="box" x="760" y="352" width="216" height="62" rx="8"/><text x="774" y="376" class="h">Hand-off queue</text><text x="774" y="396" class="s">context card, no repeating</text>
  <path class="l" d="M718 290 C740 300 740 380 758 382"/>

  <text x="24" y="460" class="k">WATCHING IT</text>
  <rect class="box" x="24" y="474" width="300" height="62" rx="8"/><text x="38" y="498" class="h">Mission Control, Live Call View</text><text x="38" y="518" class="s">live from the ledger's event stream</text>
  <path class="l" d="M300 314 C300 400 190 420 190 472"/>
  <rect class="box" x="348" y="474" width="300" height="62" rx="8"/><text x="362" y="498" class="h">Twins + judge (evaluation)</text><text x="362" y="518" class="s">simulated merchants, seeded, offline</text>
  <rect class="box" x="672" y="474" width="304" height="62" rx="8"/><text x="686" y="498" class="h">Demo scenarios</text><text x="686" y="518" class="s">one command or one click, real gate</text>
  <text x="24" y="580" class="s">Independent project, not affiliated with Paytm. Business systems are labelled mocks.</text>
</svg>
